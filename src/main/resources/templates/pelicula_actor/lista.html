<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Relaciones Película-Actor</title>
</head>
<body>
    <h1>Relaciones Película - Actor</h1>
    <a th:href="@{/}">Inicio</a>
    <a th:href="@{/pelicula-actor/nuevo}">Nueva Relación</a>

    <table border="1">
        <thead>
            <tr>
                <th>Código Película</th>
                <th>Código Actor</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r : ${relaciones}">
                <td th:text="${r.id.codigoPelicula}"></td>
                <td th:text="${r.id.codigoActor}"></td>
                <td>
                    <a th:href="@{'/pelicula-actor/eliminar?codigoPelicula=' + ${r.id.codigoPelicula} + '&codigoActor=' + ${r.id.codigoActor}}">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
